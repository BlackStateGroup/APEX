name: APEX foundation checks
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run research:setup
      - name: Verify source archive restoration
        run: python3 -m unittest discover -s tests -p 'test_source_archives.py' -v
      - name: Verify REA readiness diagnostics
        run: node --test tools/reverse-engineering/preflight.test.mjs
      - run: npm test
      - run: npm run typecheck
      - run: python3 tools/build_firmware.py --sanitize
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Retain case workspace browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case-workspace-evidence
          path: |
            review-evidence/case-workspace/
            review-evidence/research-worker/
            test-results/
          if-no-files-found: ignore
      - run: npm run inventory:check
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Bound Gradle distribution download timeout
        run: node tools/configure-gradle-download.mjs android/gradle/wrapper/gradle-wrapper.properties
      - name: Compile native module
        working-directory: android
        run: ./gradlew :apex-device:compileDebugKotlin --no-daemon
      - name: Test Android USB permission callbacks
        working-directory: android
        run: ./gradlew :apex-device:testDebugUnitTest --no-daemon
      - name: Verify native IQ Java ownership and real host JNI
        run: |
          node --test modules/apex-iq/source.test.mjs
          bash modules/apex-iq/host-check.sh
          bash modules/apex-iq/host-check.sh --sanitize
      - name: Compile and test native IQ module
        working-directory: android
        run: ./gradlew :apex-iq:compileDebugKotlin :apex-iq:assembleDebug :apex-iq:testDebugUnitTest -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Compile native IQ release libraries
        working-directory: android
        run: ./gradlew :apex-iq:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Assemble debug APK including NFC and Bluetooth
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
  esp32s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cross-compile accessory target
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware/esp32s3 set-target esp32s3 build

  ios:
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Compile unsigned iPhone Simulator app
        run: xcodebuild -workspace ios/APEX.xcworkspace -scheme APEX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
