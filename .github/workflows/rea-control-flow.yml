name: REA byte-verified control flow
on:
  pull_request:
    paths:
      - 'tools/inspect-control-flow.mjs'
      - 'tools/verify-control-flow.mjs'
      - 'tools/research-control-flow.mjs'
      - 'tools/reverse-engineering/**'
      - 'tests/rea-control-flow*.test.mjs'
      - 'firmware/core/**'
      - 'firmware/host/main.c'
      - '.github/workflows/rea-control-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rea-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-host-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Use the existing pinned desktop REA dependencies
        run: npm ci --prefix tools/reverse-engineering --ignore-scripts --omit=optional
      - name: Structural, adversarial and real supervised integration tests
        run: node --test tests/rea-control-flow*.test.mjs
        env:
          APEX_REA_INTEGRATION: '1'
      - name: Reproduce compiler and negative-control evidence without executing the targets
        run: node tools/research-control-flow.mjs "$RUNNER_TEMP/apex-rea-flow-experiment"
      - name: Independently replay retained evidence against each exact artifact
        run: |
          for variant in O0 O2 Os O2-poly8005; do
            node --permission --allow-fs-read="$GITHUB_WORKSPACE" --allow-fs-read="$RUNNER_TEMP/apex-rea-flow-experiment" \
              tools/verify-control-flow.mjs "$RUNNER_TEMP/apex-rea-flow-experiment/$variant.elf" \
              "$RUNNER_TEMP/apex-rea-flow-experiment/$variant" > "$RUNNER_TEMP/$variant.verified-byte-linkage.json"
          done
