name: Lab-only signed-read peer
on:
  pull_request:
    paths:
      - 'firmware/lab_signed_read/**'
      - 'firmware/esp32s3-signed-lab/**'
      - 'firmware/core/**'
      - 'packages/core/accessory-trust.ts'
      - 'packages/protocol/**'
      - 'tests/lab*'
      - 'tests/lab-sdk-stubs/**'
      - 'tests/native-trust/**'
      - 'modules/apex-trust/**'
      - 'packages/core/accessory-signed-connection.ts'
      - 'packages/core/accessory-native-adapters.ts'
      - 'src/*SignedRead*'
      - 'src/signed-read*'
      - 'src/platform/signed-read*'
      - 'tools/*lab_signed_read*'
      - 'tools/check_lab_native_crypto.mjs'
      - 'tools/check_signed_lab_ui.mjs'
      - 'App.tsx'
      - '.github/workflows/lab-signed-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python3 tools/build_lab_signed_read.py
      - run: node --test tests/lab-signed-read.test.ts tests/accessory-trust.test.ts
      - run: python3 tools/build_lab_signed_read.py --sanitize
      - run: APEX_LAB_SANITIZE=1 node --test tests/lab-signed-read.test.ts
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: node tools/check_lab_native_crypto.mjs --java
  lab-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: EXPO_PUBLIC_APEX_SIGNED_LAB=1 npx expo export --platform web --output-dir build/signed-lab-web
      - run: npx playwright install --with-deps chromium
      - run: node tools/check_signed_lab_ui.mjs
  apple-crypto:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node tools/check_lab_native_crypto.mjs --swift
  esp32s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      matrix:
        mode: ['off', 'on']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile only, never flash or provision
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          project="$PWD/firmware/esp32s3-signed-lab"
          defaults="$project/sdkconfig.defaults"
          if [ '${{ matrix.mode }}' = on ]; then
            printf 'CONFIG_APEX_SIGNED_READ_LAB_OPT_IN=y\n' > "$RUNNER_TEMP/lab-on.defaults"
            defaults="$defaults;$RUNNER_TEMP/lab-on.defaults"
          fi
          idf.py -C "$project" -B "$PWD/build/lab-${{ matrix.mode }}" \
            -D "SDKCONFIG=$PWD/build/sdkconfig-lab-${{ matrix.mode }}" \
            -D "SDKCONFIG_DEFAULTS=$defaults" -D IDF_TARGET=esp32s3 build
